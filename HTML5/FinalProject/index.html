<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Community Event Portal</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
}

nav{
    background:#333;
    padding:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-right:15px;
}

#welcomeBanner{
    background:lightblue;
    padding:15px;
    margin-top:10px;
}

.highlight{
    background:yellow;
}

.gallery img{
    width:200px;
    height:150px;
    margin:10px;
    border:2px solid black;
}

</style>
</head>

<body>

<header>
    <h1>Local Community Event Portal</h1>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#register">Register</a>
    <a href="#contact">Contact</a>
</nav>

<section id="home">

<div id="welcomeBanner">

<h2>Welcome User!</h2>

<p>
Special Offer:
<span style="color:red;font-weight:bold;">
50% OFF
</span>
</p>

<p class="highlight">
Register before the deadline.
</p>

</div>

</section>

<hr>

<section id="gallery">

<h2>Event Gallery</h2>

<div class="gallery">

<img src="https://picsum.photos/200?1"
alt="Music Event"
title="Music Event"
ondblclick="enlarge(this)">

<img src="https://picsum.photos/200?2"
alt="Sports Event"
title="Sports Event"
ondblclick="enlarge(this)">

<img src="https://picsum.photos/200?3"
alt="Food Festival"
title="Food Festival"
ondblclick="enlarge(this)">

</div>

</section>

<hr>

<section id="register">

<h2>Event Registration</h2>

<form onsubmit="submitForm(event)">

<label>Name</label><br>

<input
type="text"
required
autofocus>

<br><br>

<label>Email</label><br>

<input
type="email"
required>

<br><br>

<label>Phone</label><br>

<input
type="text"
id="phone"
onblur="validatePhone()">

<br><br>

<label>Date</label><br>

<input
type="date"
required>

<br><br>

<label>Select Event</label><br>

<select id="eventType" onchange="showFee()">

<option value="">Select Event</option>
<option value="100">Music Event</option>
<option value="200">Sports Event</option>
<option value="300">Food Festival</option>

</select>

<p id="fee"></p>

<textarea
id="feedback"
rows="5"
cols="40"
placeholder="Feedback"
onkeyup="countCharacters()">
</textarea>

<p>
Characters:
<span id="count">0</span>
</p>

<button type="submit">
Register
</button>

</form>

<p id="message"></p>

</section>

<hr>

<section>

<h2>Promo Video</h2>

<video
width="500"
controls
oncanplay="videoReady()">

<source src="sample.mp4" type="video/mp4">

</video>

<p id="videoMessage"></p>

</section>

<hr>

<section>

<h2>User Preference</h2>

<button onclick="savePreference()">
Save Preference
</button>

<button onclick="clearPreference()">
Clear Preference
</button>

</section>

<hr>

<section>

<h2>Find Nearby Events</h2>

<button onclick="getLocation()">
Get Location
</button>

<p id="location"></p>

</section>

<hr>

<footer id="contact">

<h2>Contact</h2>

<p>Email: community@gmail.com</p>

</footer>

<script>

function validatePhone()
{
    let phone =
    document.getElementById("phone").value;

    if(phone.length != 10)
    {
        alert("Phone number must contain 10 digits");
    }
}

function showFee()
{
    let fee =
    document.getElementById("eventType").value;

    document.getElementById("fee").innerHTML =
    "Event Fee = ₹" + fee;
}

function submitForm(event)
{
    event.preventDefault();

    document.getElementById("message").innerHTML =
    "Registration Successful";
}

function enlarge(img)
{
    img.style.width="350px";
}

function countCharacters()
{
    let text =
    document.getElementById("feedback").value;

    document.getElementById("count").innerHTML =
    text.length;
}

function videoReady()
{
    document.getElementById("videoMessage").innerHTML =
    "Video Ready To Play";
}

function savePreference()
{
    let value =
    document.getElementById("eventType").value;

    localStorage.setItem(
    "eventPreference",
    value
    );

    alert("Preference Saved");
}

window.onload=function()
{
    let saved =
    localStorage.getItem(
    "eventPreference"
    );

    if(saved)
    {
        document.getElementById("eventType").value =
        saved;
    }
}

function clearPreference()
{
    localStorage.clear();
    alert("Preference Removed");
}

function getLocation()
{
    if(navigator.geolocation)
    {
        navigator.geolocation.getCurrentPosition(

        function(position)
        {
            document.getElementById("location").innerHTML =
            "Latitude: " +
            position.coords.latitude +
            "<br>Longitude: " +
            position.coords.longitude;
        }

        );
    }
}

</script>

</body>
</html>
