<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>

    <style>

        #welcomeBanner {
            background-color: lightblue;
            padding: 20px;
            border: 2px solid blue;
        }

        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 5px;
        }

    </style>

</head>

<body>

    <div id="welcomeBanner">

        <h1>Welcome User!</h1>

        <p>
            Special Offer:
            <span style="color:red;">
                50% OFF on Event Registration
            </span>
        </p>

        <p class="highlight">
            Register before the deadline.
        </p>

    </div>

</body>

</html>
