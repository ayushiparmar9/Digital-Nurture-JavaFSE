<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Registration Form</title>
</head>

<body>

    <h1>Community Event Registration</h1>

    <form>

        <label>Name:</label>
        <br>

        <input
            type="text"
            placeholder="Enter your name"
            required
            autofocus>

        <br><br>

        <label>Email:</label>
        <br>

        <input
            type="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <label>Date of Participation:</label>
        <br>

        <input
            type="date"
            required>

        <br><br>

        <label>Select Event:</label>
        <br>

        <select>

            <option>
                Music Event
            </option>

            <option>
                Sports Event
            </option>

            <option>
                Food Festival
            </option>

            <option>
                Charity Event
            </option>

        </select>

        <br><br>

        <label>Feedback:</label>
        <br>

        <textarea
            rows="5"
            cols="40"
            placeholder="Enter your feedback">
        </textarea>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
